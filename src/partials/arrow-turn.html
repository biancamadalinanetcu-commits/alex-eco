<!-- The closing 3D arrow. Scrolling turns it to face the visitor: frames rendered at different angles
     (scripts/render-arrow.mjs) are drawn on the canvas as the section scrolls into view. They load only
     when the section is near. Without JavaScript, or with reduced motion, the still picture shows. -->
<div class="turn" data-turn data-frames="60" data-src="assets/arrow/d/" data-src-sm="assets/arrow/m/">
  <picture>
    <source media="(max-width: 700px)" srcset="assets/arrow/m/still.webp" width="960" height="560">
    <img class="turn__still" src="assets/arrow/d/still.webp" alt="" width="1600" height="700" loading="lazy" decoding="async">
  </picture>
  <canvas class="turn__canvas"></canvas>
</div>
