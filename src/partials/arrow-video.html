<!-- The closing 3D clip (rendered by scripts/render-video.mjs). It loads only when it comes near the
     viewport, plays only while visible, and stays a still frame for reduced motion or data saver. -->
<video class="loop-video" data-loop-video muted loop playsinline disablepictureinpicture preload="none" tabindex="-1" width="1600" height="700"
  data-poster="assets/video/cta-arrow-poster.webp" data-poster-sm="assets/video/cta-arrow-sm-poster.webp">
  <source data-src="assets/video/cta-arrow.webm" data-src-sm="assets/video/cta-arrow-sm.webm" type="video/webm">
  <source data-src="assets/video/cta-arrow.mp4" data-src-sm="assets/video/cta-arrow-sm.mp4" type="video/mp4">
</video>
