<script>
  /* Runs before first paint: marks JS as available, restores the chosen language
     and starts the page-transition wipe when arriving from another Scalium page. */
  (function (d) {
    var h = d.documentElement;
    h.className = h.className.replace('no-js', 'js');
    try {
      var q = new URLSearchParams(location.search).get('lang');
      var stored = null;
      try { stored = localStorage.getItem('scalium-lang'); } catch (e) {}
      /* the /ro/ pages are Romanian by address; elsewhere the visitor's choice, then the browser */
      h.setAttribute('data-page-lang', h.lang === 'ro' ? 'ro' : 'en');
      /* on a /ro/ page, keep English if the visitor switched to it on the previous Scalium page */
      var ref = null;
      try { ref = new URL(d.referrer); } catch (e) {}
      var refLang = ref && ref.origin === location.origin ? ref.searchParams.get('lang') : null;
      var l = q || (h.lang === 'ro' ? (refLang === 'en' ? 'en' : 'ro') : stored || ((navigator.language || '').toLowerCase().indexOf('ro') === 0 ? 'ro' : 'en'));
      l = l === 'ro' ? 'ro' : 'en';
      h.lang = l;
      h.setAttribute('data-lang', l);
      if (sessionStorage.getItem('scalium-wipe') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        h.classList.add('is-entering');
        setTimeout(function () { h.classList.add('is-entered'); }, 1500); /* safety net if scripts fail */
      }
      sessionStorage.removeItem('scalium-wipe');
      /* The logo intro plays from the top of the home page; a link to one of its sections skips it.
         If the animation script failed (it has run by the time the page has loaded), drop the
         intro so the hero is never left covered. A slow connection only delays it. */
      if (/^#(top|main|services|process|results|contact-cta)$/.test(location.hash)) h.classList.add('intro-skip');
      /* Back/forward returns to where the visitor was. (A reload of the home page starts at the top so the
         intro replays: main.js marks the page for that when it is left.) */
      var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
      window.__scaliumBack = !!nav && nav.type === 'back_forward';
      if (window.__scaliumBack && 'scrollRestoration' in history) history.scrollRestoration = 'auto';
      window.addEventListener('load', function () {
        if (!window.__scaliumIntro) h.classList.add('intro-skip', 'hero-go');
        /* main.js never ran (blocked or failed): drop the animation-only styles so nothing stays hidden */
        if (!window.__scaliumBoot) { h.classList.remove('js'); h.classList.add('no-js'); }
      });
    } catch (e) {}
  })(document);
</script>
