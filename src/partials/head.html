<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020305">
<meta name="color-scheme" content="dark">
<script>
  /* Runs before first paint: marks JS as available, restores the chosen language
     and starts the page-transition wipe when arriving from another Scalium page. */
  (function (d) {
    var h = d.documentElement;
    h.className = h.className.replace('no-js', 'js');
    try {
      var q = new URLSearchParams(location.search).get('lang');
      var l = q || localStorage.getItem('scalium-lang') || ((navigator.language || '').toLowerCase().indexOf('ro') === 0 ? 'ro' : 'en');
      if (l === 'ro') h.lang = 'ro';
      h.setAttribute('data-lang', l === 'ro' ? 'ro' : 'en');
      if (sessionStorage.getItem('scalium-wipe') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        h.classList.add('is-entering');
        setTimeout(function () { h.classList.add('is-entered'); }, 1500); /* safety net if scripts fail */
      }
      sessionStorage.removeItem('scalium-wipe');
      /* The logo intro plays from the top of the home page; a link to one of its sections skips it.
         If the animation script failed (it has run by the time the page has loaded), drop the
         intro so the hero is never left covered. A slow connection only delays it. */
      if (/^#(top|main|services|process|results|contact-cta)$/.test(location.hash)) h.classList.add('intro-skip');
      /* a reload starts at the top, so the logo intro plays again from the beginning */
      else if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.addEventListener('load', function () { if (!window.__scaliumIntro) h.classList.add('intro-skip', 'hero-go'); });
    } catch (e) {}
  })(document);
</script>
