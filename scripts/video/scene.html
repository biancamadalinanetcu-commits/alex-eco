<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scalium arrow render</title>
<style>html,body{margin:0;background:#020305;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Offline render of the closing video: the Scalium mark extruded into brushed metal, standing on a
// dark reflective floor, with blue light glowing from its edges. scripts/render-video.mjs steps
// renderFrame(t) for t in [0, 1) and encodes the frames; every motion is periodic so the clip loops.
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
RectAreaLightUniformsLib.init();

const q = new URLSearchParams(location.search);
const W = Number(q.get('w') || 1600);
const H = Number(q.get('h') || 700);
const BG = 0x020305;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 1500, 3400);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;

const camera = new THREE.PerspectiveCamera(26, W / H, 10, 5000);

// ---- brushed metal: fine horizontal streaks as a roughness map
function brushedTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#7a7a7a'; g.fillRect(0, 0, 512, 512);
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < 2600; i++) {
    const y = rnd() * 512, v = 90 + rnd() * 90;
    g.fillStyle = `rgba(${v},${v},${v},${0.18 + rnd() * 0.3})`;
    g.fillRect(rnd() * 512 - 200, y, 200 + rnd() * 400, 0.6 + rnd() * 1.2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(0.012, 0.012);
  return t;
}
const brushed = brushedTexture();

const metal = new THREE.MeshPhysicalMaterial({
  color: 0xc9d1dc, metalness: 1, roughness: 0.36, roughnessMap: brushed,
  clearcoat: 0.3, clearcoatRoughness: 0.3,
});
const metalSide = new THREE.MeshPhysicalMaterial({ color: 0x8d96a4, metalness: 1, roughness: 0.3 });
// The light strip: unlit and brighter than white, so only it (and sharp highlights) blooms.
const glow = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.2, 0.55, 3.2), toneMapped: false });

// ---- the mark, from the traced logo: each piece is two brushed-metal slabs with a glowing
// strip recessed between them, so a thin line of blue light runs around every edge.
const svgText = await (await fetch('/src/assets/img/logo-mark.svg')).text();
const data = new SVGLoader().parse(svgText);
const shapes = data.paths.flatMap((p) => SVGLoader.createShapes(p));
const SLAB = 21, CORE = 8, BT = 2.6, BS = 2.4;
const slabOpts = { depth: SLAB, curveSegments: 10, bevelEnabled: true, bevelThickness: BT, bevelSize: BS, bevelSegments: 4 };
const totalDepth = 2 * (SLAB + 2 * BT) + CORE;

const mark = new THREE.Group();
const mirrorMark = new THREE.Group();
let maxH = 0;
for (const shape of shapes) {
  // every piece stands on the floor
  const probe = new THREE.ShapeGeometry(shape);
  probe.computeBoundingBox();
  const lift = -probe.boundingBox.max.y; // svg y down: the lowest point becomes y = 0
  const layer = (geo, z) => { geo.scale(1, -1, 1); geo.translate(0, -lift, z); geo.computeVertexNormals(); return geo; };
  const a = layer(new THREE.ExtrudeGeometry(shape, slabOpts), BT);
  const core = layer(new THREE.ExtrudeGeometry(shape, { depth: CORE + 2, curveSegments: 10, bevelEnabled: false }), SLAB + 2 * BT - 1);
  const b = layer(new THREE.ExtrudeGeometry(shape, slabOpts), SLAB + 2 * BT + CORE + BT);
  for (const [geo, mats] of [[a, [metal, metalSide]], [core, glow], [b, [metal, metalSide]]]) {
    const m = new THREE.Mesh(geo, mats);
    m.castShadow = true; m.receiveShadow = true;
    mark.add(m);
    const r = new THREE.Mesh(geo, Array.isArray(mats) ? [new THREE.MeshStandardMaterial({ color: 0x6d7684, metalness: 1, roughness: 0.5 }), new THREE.MeshStandardMaterial({ color: 0x4a5260, metalness: 1, roughness: 0.5 })] : glow);
    mirrorMark.add(r);
  }
  probe.computeBoundingBox();
  maxH = Math.max(maxH, probe.boundingBox.max.y - probe.boundingBox.min.y);
}
// centre the group on x/z
const box = new THREE.Box3().setFromObject(mark);
const cx = (box.min.x + box.max.x) / 2, cz = (box.min.z + box.max.z) / 2;
mark.children.forEach((m) => m.position.set(-cx, 0, -cz));
mirrorMark.children.forEach((m) => m.position.set(-cx, 0, -cz));
const height = box.max.y - box.min.y;
const pivot = new THREE.Group(); pivot.add(mark); scene.add(pivot);
const mirrorPivot = new THREE.Group(); mirrorPivot.add(mirrorMark); mirrorPivot.scale.y = -1; scene.add(mirrorPivot);

// Semi-transparent dark floor over the mirrored copy: a soft, clean reflection.
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(3000, 96),
  new THREE.MeshPhongMaterial({ color: 0x030509, specular: 0x080c16, shininess: 18, transparent: true, opacity: 0.9 }),
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// a pool of blue light on the floor around the base
const poolCanvas = document.createElement('canvas');
poolCanvas.width = poolCanvas.height = 256;
const pg = poolCanvas.getContext('2d');
const grad = pg.createRadialGradient(128, 128, 0, 128, 128, 128);
grad.addColorStop(0, 'rgba(40,120,255,0.7)');
grad.addColorStop(0.3, 'rgba(10,106,255,0.3)');
grad.addColorStop(1, 'rgba(10,106,255,0)');
pg.fillStyle = grad; pg.fillRect(0, 0, 256, 256);
const pool = new THREE.Mesh(
  new THREE.PlaneGeometry(720, 620),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(poolCanvas), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }),
);
pool.rotation.x = -Math.PI / 2;
pool.position.set(0, 0.6, 20);
scene.add(pool);

// ---- light
const key = new THREE.SpotLight(0xe6ecff, 9e5, 0, 0.3, 0.9, 2);
key.position.set(380, 700, 620);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.radius = 8;
scene.add(key, key.target);
key.target.position.set(0, 80, 0);

// a large soft box in front, so the brushed faces always carry a silver gradient
const softbox = new THREE.RectAreaLight(0xeef3ff, 3.2, 900, 420);
softbox.position.set(-260, 520, 760);
softbox.lookAt(0, 120, 0);
scene.add(softbox);

const sweep = new THREE.SpotLight(0xffffff, 2.5e5, 0, 0.12, 0.95, 2); // the light that glides across the metal
sweep.position.set(0, 420, 900);
scene.add(sweep, sweep.target);

const blueBase = new THREE.PointLight(0x1a64ff, 6e3, 520, 2);  // blue spill where the mark meets the floor
blueBase.position.set(0, 140, -90);
scene.add(blueBase);
const rim = new THREE.DirectionalLight(0x4f86ff, 1.2);
rim.position.set(-400, 300, -500);
scene.add(rim);

// ---- post: bloom makes the blue edges glow
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.85, 0.4, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const TAU = Math.PI * 2;
window.renderFrame = (t) => {
  const a = TAU * t;
  // the mark turns slowly to show its depth, then back: a seamless loop
  pivot.rotation.y = -0.58 + 0.15 * Math.sin(a);
  mirrorPivot.rotation.y = pivot.rotation.y;
  const r = 980, yaw = 0.05 * Math.sin(a + 1.1);
  camera.position.set(Math.sin(yaw) * r, height * 0.55 + 12 * Math.sin(a * 2), Math.cos(yaw) * r);
  camera.lookAt(0, height * 0.42, 0);
  // a bright highlight glides across the metal and back
  sweep.target.position.set(-220 * Math.cos(a), height * 0.6, 0);
  // the light strip breathes a little
  const pulse = 0.5 + 0.5 * Math.sin(a * 2 - 0.6);
  glow.color.setRGB(0.14 + 0.06 * pulse, 0.4 + 0.12 * pulse, 2.1 + 0.6 * pulse);
  blueBase.intensity = 5e3 + 2.5e3 * pulse;
  pool.material.opacity = 0.75 + 0.25 * pulse;
  composer.render();
};
window.renderFrame(0);
window.ready = true;
</script>
</body>
</html>
